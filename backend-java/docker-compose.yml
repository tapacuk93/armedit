services:
  sue-server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Everything typed lives here. Without this, a container restart loses
      # every screen the disk tier was holding.
      - sue-workspaces:/opt/sue/workspaces
    environment:
      # Every one of these is optional; none of them has a credential in it.
      # Credentials arrive at registration and stay in the process.
      SUE_PORT: "8080"
      SUE_PUBLIC_ADDR: "${SUE_PUBLIC_ADDR:-}"
      SUE_AICOIN: "${SUE_AICOIN:-http://host.docker.internal:8080}"
      SUE_PROVIDER: "${SUE_PROVIDER:-anthropic}"
      SUE_MODEL: "${SUE_MODEL:-}"
      SUE_AMI: "${SUE_AMI:-}"
      SUE_INSTANCE_TYPE: "${SUE_INSTANCE_TYPE:-t4g.small}"
      SUE_S3_BUCKET: "${SUE_S3_BUCKET:-}"
      SUE_IDLE_MINUTES: "${SUE_IDLE_MINUTES:-30}"

volumes:
  sue-workspaces:
