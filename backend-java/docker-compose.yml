services:
  armeditd:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Everything typed lives here. Without this, a container restart loses
      # every screen the disk tier was holding.
      - armedit-workspaces:/opt/armedit/workspaces
    environment:
      # Every one of these is optional; none of them has a credential in it.
      # Credentials arrive at registration and stay in the process.
      ARMEDIT_PORT: "8080"
      ARMEDIT_PUBLIC_ADDR: "${ARMEDIT_PUBLIC_ADDR:-}"
      ARMEDIT_AICOIN: "${ARMEDIT_AICOIN:-http://host.docker.internal:8080}"
      ARMEDIT_PROVIDER: "${ARMEDIT_PROVIDER:-anthropic}"
      ARMEDIT_MODEL: "${ARMEDIT_MODEL:-}"
      ARMEDIT_AMI: "${ARMEDIT_AMI:-}"
      ARMEDIT_INSTANCE_TYPE: "${ARMEDIT_INSTANCE_TYPE:-t4g.small}"
      ARMEDIT_S3_BUCKET: "${ARMEDIT_S3_BUCKET:-}"
      ARMEDIT_IDLE_MINUTES: "${ARMEDIT_IDLE_MINUTES:-30}"

volumes:
  armedit-workspaces:
